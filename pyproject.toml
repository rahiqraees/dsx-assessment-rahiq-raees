[project]
name = "dsx-assessment"
version = "0.1.0"
description = "Python solutions (questions 5 and 6) for the DSX Data Scientist coding assessment"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pydantic>=2.7",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx2>=2",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["question_5_api/tests", "question_6_genai/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["question_5_api", "question_6_genai"]
